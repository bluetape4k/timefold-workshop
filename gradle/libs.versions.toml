[versions]
bluetape4k-dependencies = "1.3.1"

# JetBrains Exposed (matches Versions.exposed in buildSrc/Libs.kt)
jetbrains-exposed = "1.3.0"

# Timefold Solver (not in bluetape4k-dependencies BOM — explicit version required)
timefold-solver = "2.2.0"

# R2DBC drivers not managed by spring-boot-dependencies BOM
r2dbc-mariadb = "1.3.0"
r2dbc-mysql    = "1.4.1"

# JDBC driver not managed by spring-boot-dependencies BOM
pgjdbc-ng = "0.8.9"

[libraries]
# ── bluetape4k (version managed by bluetape4k-dependencies BOM) ────────────
bluetape4k-dependencies = { module = "io.github.bluetape4k:bluetape4k-dependencies", version.ref = "bluetape4k-dependencies" }
bluetape4k-coroutines   = { module = "io.github.bluetape4k:bluetape4k-coroutines" }
bluetape4k-idgenerators = { module = "io.github.bluetape4k:bluetape4k-idgenerators" }
bluetape4k-io           = { module = "io.github.bluetape4k:bluetape4k-io" }
bluetape4k-jackson2     = { module = "io.github.bluetape4k:bluetape4k-jackson2" }
bluetape4k-javatimes    = { module = "io.github.bluetape4k:bluetape4k-javatimes" }
bluetape4k-junit5       = { module = "io.github.bluetape4k:bluetape4k-junit5" }
bluetape4k-logging      = { module = "io.github.bluetape4k:bluetape4k-logging" }
bluetape4k-spring-boot3-core = { module = "io.github.bluetape4k:bluetape4k-spring-boot-core" }
bluetape4k-testcontainers    = { module = "io.github.bluetape4k:bluetape4k-testcontainers" }
bluetape4k-timefold-solver-persistence-exposed = { module = "io.github.bluetape4k.exposed:bluetape4k-exposed-timefold-solver-persistence" }

# ── bluetape4k-exposed extensions (version managed by bluetape4k-dependencies BOM) ──
exposed-core       = { module = "io.github.bluetape4k.exposed:bluetape4k-exposed-core" }
exposed-dao        = { module = "io.github.bluetape4k.exposed:bluetape4k-exposed-dao" }
exposed-jdbc-tests = { module = "io.github.bluetape4k.exposed:bluetape4k-exposed-jdbc-tests" }
exposed-r2dbc      = { module = "io.github.bluetape4k.exposed:bluetape4k-exposed-r2dbc" }
exposed-r2dbc-tests = { module = "io.github.bluetape4k.exposed:bluetape4k-exposed-r2dbc-tests" }

# ── JetBrains Exposed (version managed by jetbrains-exposed-bom) ────────────
jetbrains-exposed-bom  = { module = "org.jetbrains.exposed:exposed-bom",  version.ref = "jetbrains-exposed" }
jetbrains-exposed-core = { module = "org.jetbrains.exposed:exposed-core" }
jetbrains-exposed-dao  = { module = "org.jetbrains.exposed:exposed-dao" }
jetbrains-exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc" }
jetbrains-exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc" }

# ── Timefold Solver (version managed by timefold-solver-bom) ────────────────
timefold-solver-bom                  = { module = "ai.timefold.solver:timefold-solver-bom",                  version.ref = "timefold-solver" }
timefold-solver-core                 = { module = "ai.timefold.solver:timefold-solver-core" }
timefold-solver-jackson              = { module = "ai.timefold.solver:timefold-solver-jackson" }
timefold-solver-spring-boot-starter  = { module = "ai.timefold.solver:timefold-solver-spring-boot-starter" }

# ── JDBC Drivers (version managed by spring-boot-dependencies BOM) ──────────
hikaricp          = { module = "com.zaxxer:HikariCP" }
h2                = { module = "com.h2database:h2" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client" }
mysql-connector-j   = { module = "com.mysql:mysql-connector-j" }
postgresql-driver   = { module = "org.postgresql:postgresql" }
pgjdbc-ng           = { module = "com.impossibl.pgjdbc-ng:pgjdbc-ng", version.ref = "pgjdbc-ng" }

# ── R2DBC (standard: spring-boot-dependencies BOM; non-standard: explicit) ──
r2dbc-pool       = { module = "io.r2dbc:r2dbc-pool" }
r2dbc-h2         = { module = "io.r2dbc:r2dbc-h2" }
r2dbc-mariadb    = { module = "org.mariadb:r2dbc-mariadb",   version.ref = "r2dbc-mariadb" }
r2dbc-mysql      = { module = "io.asyncer:r2dbc-mysql",       version.ref = "r2dbc-mysql" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }

# ── Testcontainers (version managed by testcontainers-bom) ──────────────────
testcontainers-lib        = { module = "org.testcontainers:testcontainers" }
testcontainers-mariadb    = { module = "org.testcontainers:mariadb" }
testcontainers-mysql      = { module = "org.testcontainers:mysql" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }

# ── Kotlinx Coroutines (version managed by kotlinx-coroutines-bom) ──────────
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }

# ── Reactor (version managed by spring-boot-dependencies BOM) ───────────────
reactor-kotlin-extensions = { module = "io.projectreactor.kotlin:reactor-kotlin-extensions" }

# ── Spring Boot (version managed by spring-boot-dependencies BOM) ───────────
spring-boot-autoconfigure           = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-autoconfigure-processor = { module = "org.springframework.boot:spring-boot-autoconfigure-processor" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-devtools                = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-aop             = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-webflux         = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-test            = { module = "org.springframework.boot:spring-boot-starter-test" }
